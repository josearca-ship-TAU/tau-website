<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank You | TAU LLC FZ</title>
<link rel="stylesheet" href="./assets/site.css">
<style>
header .nav{width:100%;max-width:none;margin:0;padding:18px 24px}
.confirmation{width:min(1120px,92%);margin:clamp(30px,6vw,90px) auto;display:grid;grid-template-columns:1.15fr 1fr;border:1px solid #c9ae78;background:#fbf7ef}
.confirmation-copy{padding:clamp(28px,5vw,72px);align-self:center}
.confirmation h1{font-size:clamp(2.8rem,5vw,5rem);max-width:10ch}
.confirmation h1::after{content:"";display:block;width:56px;height:2px;background:#ae8847;margin:26px 0}
.confirmation p{max-width:35ch;margin:0 0 28px;font-size:1.05rem}
.confirmation-photo{width:100%;height:100%;min-height:440px;object-fit:cover}
.confirmation-links{display:flex;flex-wrap:wrap;align-items:center;gap:22px}
.confirmation-links a:last-child{text-underline-offset:5px}
@media(max-width:720px){.confirmation{grid-template-columns:1fr}.confirmation-photo{min-height:0;height:240px}.confirmation-copy{padding:32px 24px}}
</style>
</head>
<body>
<header><div class="nav"><a href="./" aria-label="TAU homepage"><img src="./assets/logo.png" width="205" alt="TAU, global trade partner"></a><nav aria-label="Main navigation"><a href="./#about">About</a><a href="./services/">Our Services</a><a href="./#inquiries">Business Inquiries</a></nav></div></header>
<main>
<section class="confirmation" aria-labelledby="confirmation-heading">
<div class="confirmation-copy">
<h1 id="confirmation-heading">Thank you for your inquiry.</h1>
<p>Your inquiry has been received. Our team will review your requirements and respond using the contact details you provided.</p>
<div class="confirmation-links"><a class="button" href="./">Return to Home</a><a href="./services/">Explore Our Services</a></div>
</div>
<img class="confirmation-photo" src="./assets/hero.webp" alt="Kraft paper rolls and corrugated packaging materials">
</section>
</main>
<footer>TAU LLC FZ <span>·</span> United Arab Emirates <span>·</span> taugrp.com</footer>
</body></html>
